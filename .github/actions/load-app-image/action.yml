name: Load app image
description: Load a Docker image from a workflow artifact or rebuild it from GHA cache

inputs:
  image_artifact_name:
    description: Artifact name produced by the build-app-image action
    required: false
    default: ''
  image_context:
    description: Docker build context when rebuilding from cache
    required: false
    default: '.'
  image_dockerfile:
    description: Path to Dockerfile when rebuilding from cache
    required: false
    default: ''
  image_target:
    description: Docker build target stage when rebuilding from cache
    required: false
    default: ''
  image_tags:
    description: Docker image tags when rebuilding from cache
    required: false
    default: ''
  image_build_args:
    description: Docker build arguments when rebuilding from cache
    required: false
    default: ''
  image_secret_files:
    description: Docker build secret files when rebuilding from cache
    required: false
    default: ''
  buildx_platforms:
    description: Preferred platforms for Docker Buildx when rebuilding from cache
    required: false
    default: ''
  aws_region:
    description: AWS region for assuming a role when rebuilding from cache
    required: false
    default: ''
  aws_role_to_assume:
    description: Role to be assumed for AWS authentication when rebuilding from cache
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Download Docker image artifact
      if: ${{ inputs.image_artifact_name != '' }}
      uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.image_artifact_name }}
        path: /tmp/ci-docker-image

    - name: Load Docker image from artifact
      if: ${{ inputs.image_artifact_name != '' }}
      shell: bash
      run: docker load --input /tmp/ci-docker-image/ci-docker-image.tar.gz

    - name: Configure AWS credentials
      if: ${{ inputs.image_artifact_name == '' && inputs.aws_role_to_assume != '' }}
      uses: aws-actions/configure-aws-credentials@v5
      with:
        aws-region: ${{ inputs.aws_region }}
        role-to-assume: ${{ inputs.aws_role_to_assume }}

    - name: Set up Docker Buildx
      if: ${{ inputs.image_artifact_name == '' }}
      id: buildx
      uses: docker/setup-buildx-action@v3
      with:
        platforms: ${{ inputs.buildx_platforms }}

    - name: Rebuild app image from cache
      if: ${{ inputs.image_artifact_name == '' }}
      uses: docker/build-push-action@v6
      with:
        builder: ${{ steps.buildx.outputs.name }}
        context: ${{ inputs.image_context }}
        file: ${{ inputs.image_dockerfile }}
        target: ${{ inputs.image_target }}
        push: false
        load: true
        tags: ${{ inputs.image_tags }}
        build-args: ${{ inputs.image_build_args }}
        secret-files: ${{ inputs.image_secret_files }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
