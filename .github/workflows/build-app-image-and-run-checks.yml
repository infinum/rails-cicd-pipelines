# This reusable workflow depends on project to have following scripts
#   bin/audit
#   bin/lint

name: Build app image and run checks
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      # See: https://hub.docker.com/_/postgres
      postgres_version:
        description: Postgres version for running tests (eg. 13.6)
        required: false
        type: string

      postgres_user:
        description: Postgres user
        required: false
        type: string

      postgres_password:
        description: Postgres password
        required: false
        type: string

      # See: https://hub.docker.com/_/mysql
      mysql_version:
        description: MySQL version for running tests (eg. 9.1). Use root user.
        required: false
        type: string

      mysql_root_password:
        description: MySQL root user password
        required: false
        type: string

      runner:
        description: Set the runner for the workflow (eg. ubuntu-20.04)
        required: false
        type: string
        default: ubuntu-latest

      timeout_minutes:
        description: Workflow timeout
        required: false
        type: number
        default: 10

      target:
        description: Set the target build stage for the image (eg. test or deploy)
        required: false
        type: string

      context:
        description: Docker context
        required: false
        type: string
        default: "."

      file:
        description: Path to Dockerfile
        required: false
        type: string

      build_args:
        description: Docker build arguments
        required: false
        type: string

      secret_mount_src:
        description: Secret source path, relative to the repo root (eg. infra/ci/docker/application.yml)
        required: false
        type: string

      secret_mount_dst:
        description: Secret destination path in the application image, relative to the repo root (eg. config/application.yml)
        required: false
        type: string

      # Examples:
      #   Basic docker command
      #     docker run app bin/test
      #   Docker with database connection
      #     docker run \
      #       --env DB_HOST=127.0.0.1 \
      #       --env DB_PORT=3306 \
      #       --env DB_USERNAME=root \
      #       --env DB_PASSWORD=password \
      #       --network=host \
      #       app \
      #       bin/test
      #   Docker with bind mounts
      #     docker run \
      #       --mount type=bind,src="$(pwd)"/infra/ci/docker/.env,dst=/app/.env \
      #       app \
      #       bin/test
      test_command:
        description: Command for running the test suite
        required: true
        type: string

jobs:
  build_image:
    name: Build app image and run checks
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout_minutes }}

    services:
      postgres:
        image: ${{ inputs.postgres_version && format('postgres:{0}', inputs.postgres_version) }}
        env:
          POSTGRES_USER: ${{ inputs.postgres_user }}
          POSTGRES_PASSWORD: ${{ inputs.postgres_password }}
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      mysql:
        image: ${{ inputs.mysql_version && format('mysql:{0}', inputs.mysql_version) }}
        env:
          MYSQL_ROOT_PASSWORD: ${{ inputs.mysql_root_password }}
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 3306:3306

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Build app image
        uses: docker/build-push-action@v5
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: ${{ inputs.context }}
          file: ${{ inputs.file }}
          target: ${{ inputs.target }}
          push: false
          load: true
          tags: app
          build-args: ${{ inputs.build_args }}
          secret-files: |
            app_secrets=${{ inputs.secret_mount_src }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Lint
        run: |
          docker run \
            --mount type=bind,src=$PWD/${{ inputs.secret_mount_src }},dst=/app/${{ inputs.secret_mount_dst }} \
            app \
            bin/lint

      - name: Audit
        run: docker run app bin/audit

      - name: Test
        if: ${{ inputs.test_command }}
        run: ${{ inputs.test_command }}
