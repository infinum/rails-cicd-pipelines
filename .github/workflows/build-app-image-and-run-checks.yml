name: Build app image and run checks

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      # See: https://github.com/docker-library/docs/blob/master/postgres/README.md#supported-tags-and-respective-dockerfile-links
      postgres_version:
        description: 'Postgres version for running tests (eg. 13.6)'
        required: true
        type: string

      # See: https://docs.github.com/en/actions/using-github-hosted-runners/about-github-hosted-runners#supported-runners-and-hardware-resources
      runner:
        description: 'Set the runner for the workflow (eg. ubuntu-20.04)'
        required: false
        type: string
        default: ubuntu-latest

      # See: https://docs.docker.com/engine/reference/commandline/image_build/#target
      image_target:
        description: 'Set the target build stage for the image (eg. test or deploy)'
        required: false
        type: string

jobs:
  build_image:
    name: Build app image and run checks
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:${{ inputs.postgres_version }}
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: --name=postgres

    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1

      - name: Detect app env
        id: app-env
        env:
          POSTGRES_VERSION: ${{ inputs.postgres_version }}
        run: infra/ci/detect_app_env

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Build app image
        uses: docker/build-push-action@v5
        with:
          context: .
          builder: ${{ steps.buildx.outputs.name }}
          file: Dockerfile
          target: ${{ inputs.image_target }}
          push: false
          load: true
          tags: app
          build-args: |
            RUBY_VERSION=${{ steps.app-env.outputs.ruby_version }}
            BUNDLER_VERSION=${{ steps.app-env.outputs.bundler_version }}
            NODE_MAJOR=${{ steps.app-env.outputs.node_major }}
            YARN_VERSION=${{ steps.app-env.outputs.yarn_version }}
          secret-files: |
            app_secrets=infra/ci/docker/application.yml
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Lint
        run: |
          docker run \
            --mount type=bind,src=$PWD/infra/ci/docker/application.yml,dst=/app/config/application.yml \
            app \
            bin/lint

      - name: Audit
        run: docker run app bin/audit

      - name: Wait for Postgres to be ready
        run: until docker exec postgres pg_isready; do sleep 1; done

      - name: Test
        run: |
          docker run \
            --env DATABASE_HOST=localhost \
            --env DATABASE_USERNAME=postgres \
            --env DATABASE_PASSWORD=postgres \
            --network="host" \
            --mount type=bind,src=$PWD/infra/ci/docker/application.yml,dst=/app/config/application.yml \
            app \
            bin/test
