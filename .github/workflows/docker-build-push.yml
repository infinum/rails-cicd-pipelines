name: Docker build and push

on:
  workflow_call:
    inputs:
      aws_region:
        description: AWS region
        required: true
        type: string
      aws_ecr_account_id:
        description: AWS ECR account id (if ECR is on a separate AWS account)
        required: false
        type: string
      tags:
        description: Docker image tags
        required: true
        type: string
      timeout_minutes:
        description: Job timeout in minutes
        required: false
        type: number
        default: 30
      context:
        description: Docker build context
        required: false
        type: string
        default: "."
      file:
        description: Path to Dockerfile
        required: false
        type: string
      target:
        description: Target stage to build
        required: false
        type: string
      platforms:
        description: List of platform to build
        required: false
        type: string
        default: "linux/amd64"
      build_args:
        description: List of build-time variables
        required: false
        type: string
    secrets:
      AWS_IAM_ACCESS_KEY_ID:
        required: true
      AWS_IAM_ACCESS_KEY_ID:
        required: true

jobs:
  build:
    name: 'Build and push docker image'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    steps:
    - name: Check out code
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      with:
        driver: docker-container

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_IAM_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_IAM_ACCESS_SECRET_KEY }}
        aws-region: ${{ inputs.aws_region }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1
      with:
        registries: ${{ inputs.aws_ecr_account_id }}
        aws-region: ${{ inputs.aws_region }}

    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        context: ${{ inputs.context }}
        platforms: ${{ inputs.platforms }}
        file: ${{ inputs.file }}
        target: ${{ inputs.target }}
        push: true
        build-args: ${{ inputs.build_args }}
        tags: ${{ inputs.tags }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
